name: Web

on:
  push:
    branches: [feat/web-edition, integration/desktop-web, integration/rc5, main]
  pull_request:
    paths:
      - "web/**"
      - "engine/**"
      - "src/**"
      - "public/**"
      - "package*.json"
      - "index.html"
      - "*.config.*"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "scripts/smoke_web*.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Same-repository web branches already run on push, including when a PR is open.
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/web-edition' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Check web interface
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      - name: Test web service and engine
        run: |
          uv sync --project web --locked --python 3.12.14
          uv run --project web --frozen python -m unittest discover -s web/tests -v
          uv run --project engine --frozen python -m unittest discover -s engine/tests -v
      - name: Build and verify the restricted container
        run: |
          docker build --tag huntwick-web:ci .
          uv run --project web --frozen python scripts/smoke_web.py huntwick-web:ci
      - name: Test authenticated search and CSV export in Chromium
        run: |
          uv run --project web --frozen playwright install --with-deps chromium
          uv run --project web --frozen python scripts/smoke_web.py huntwick-web:ci --browser
