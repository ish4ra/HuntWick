name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: prerelease
        options:
          - prerelease
          - stable

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/verify-and-package.yml
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: huntwick-*
          merge-multiple: true
          path: installers
      - name: Verify checksums and publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -1 "$tag")" = "$(git rev-parse HEAD)" || {
              echo "Existing $tag points to another commit." >&2
              exit 1
            }
          fi
          flags=()
          if [[ "$CHANNEL" == prerelease ]]; then
            flags+=(--prerelease)
          elif [[ "$version" == *-* ]]; then
            echo "Choose prerelease for version $version." >&2
            exit 1
          fi
          cd installers
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          gh release create "$tag" --target "$GITHUB_SHA" --title "HuntWick $version" \
            --generate-notes "${flags[@]}" -- *.exe *.dmg *.deb *.AppImage SHA256SUMS
