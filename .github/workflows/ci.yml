name: CI

on:
  push:
    branches-ignore: [feat/web-edition]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/web-edition'
    uses: ./.github/workflows/verify-and-package.yml
