name: Review failed RC.6 package checks
on:
  push:
    branches: [verify/rc6-diagnostics]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read failure lines from the production job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO=ish4ra/HuntWick
          for job in $(gh api repos/ish4ra/HuntWick/actions/runs/45977057788/jobs --jq '.jobs[]|select(.conclusion=="failure")|.id'); do
            if ! curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/ish4ra/HuntWick/actions/jobs/$job/logs" > "$RUNNER_TEMP/$job.log" 2>"$RUNNER_TEMP/msg"; then
              echo "::notice::Job log API status for $job: $(grep -oE '(HTTP |error: )[0-9]{3}' "$RUNNER_TEMP/msg" || echo unavailable)"
              continue
            fi
            python - "$RUNNER_TEMP/$job.log" "$job" <<'PY'
          from pathlib import Path
          import re, sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for line in lines:
              msg=line.partition('Z ')[2]
              if "Proxy connection failure" in msg or re.search(r'(?:ValueError|KeyError|AssertionError|ModuleNotFoundError|FileNotFoundError|configparser\.\w+|RuntimeError|subprocess\.CalledProcessError):|mismatch for|Mismatched|^error\[E\d+\]',msg):
                  print(f'::notice title=Native check {sys.argv[2]}::{msg[:1800]}')
          PY
          done
