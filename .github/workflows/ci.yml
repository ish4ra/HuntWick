name: Review failed RC.6 package checks
on:
  push:
    branches: [verify/rc6-diagnostics]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read failure lines from the production job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for job in $(gh api repos/ish4ra/HuntWick/actions/runs/45977057788/jobs --jq '.jobs[]|select(.conclusion=="failure")|.id'); do
            gh api repos/ish4ra/HuntWick/actions/jobs/$job/logs > "$RUNNER_TEMP/$job.log"
            python - "$RUNNER_TEMP/$job.log" "$job" <<'PY'
          from pathlib import Path
          import re, sys
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for line in lines:
              msg=line.partition('Z ')[2]
              if re.search(r'^(?:ValueError|KeyError|AssertionError|ModuleNotFoundError|FileNotFoundError|configparser\.\w+|RuntimeError|subprocess\.CalledProcessError):|^Verified packaged icon|mismatch for|Mismatched|^error\[E\d+\]',msg):
                  print(f'::notice title=Native check {sys.argv[2]}::{msg[:1800]}')
          PY
          done
