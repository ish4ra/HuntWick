name: Verify and package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            bundles: nsis
          - target: aarch64-apple-darwin
            runner: macos-15
            bundles: dmg
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: dmg
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf \
            xvfb xauth dbus-x11
      - name: Install Rust, Python, and locked dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target "$TARGET"
          uv python install 3.12.14
          uv sync --project engine --frozen --python 3.12.14
          npm ci
      - name: Check frontend and engine
        run: |
          npm run lint
          npm run typecheck
          npm test
          uv run --project engine --frozen python -m unittest discover -s scripts -p test_smoke_desktop.py
          npm run build
      - name: Check engine parity and process lifecycle
        run: |
          if ! uv run --project engine --frozen python -m unittest discover -v -s engine/tests > engine-tests.log 2>&1; then
            cat engine-tests.log
            echo '### Engine regression failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -80 engine-tests.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat engine-tests.log
      - name: Freeze the native engine
        run: |
          uv run --project engine --frozen python engine/build.py
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target "$TARGET"
          uv run --project engine --frozen python scripts/desktop_notices.py
      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target "$TARGET" --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --target "$TARGET"
      - name: Build desktop installers and checksums
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm run tauri -- build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
          uv run --project engine --frozen python scripts/stage_installers.py "$TARGET"
      - name: Test installed Windows engine and desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-Item "installers/$env:TARGET/*.exe").FullName
          $installDir = Join-Path $env:RUNNER_TEMP HuntWick
          $install = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          uv run --project engine --frozen python scripts/smoke_engine.py "$installDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --project engine --frozen python scripts/smoke_desktop.py "$installDir/huntwick.exe"
      - name: Test engine and desktop from the mounted DMG
        if: runner.os == 'macOS'
        run: |
          mountpoint="$RUNNER_TEMP/huntwick-dmg"
          mkdir "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "installers/$TARGET/"*.dmg
          trap 'hdiutil detach "$mountpoint"' EXIT
          uv run --project engine --frozen python scripts/smoke_engine.py "$mountpoint"
          apps=("$mountpoint/"*.app)
          uv run --project engine --frozen python scripts/smoke_desktop.py "${apps[0]}/Contents/MacOS/huntwick"
      - name: Test installed Debian desktop and both Linux engines
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i "installers/$TARGET/"*.deb
          uv run --project engine --frozen python scripts/smoke_engine.py /usr/lib/HuntWick
          dbus-run-session -- xvfb-run -a uv run --project engine --frozen python scripts/smoke_desktop.py /usr/bin/huntwick
          appimage=("$GITHUB_WORKSPACE/installers/$TARGET/"*.AppImage)
          chmod +x "${appimage[0]}"
          (cd "$RUNNER_TEMP" && "${appimage[0]}" --appimage-extract >/dev/null)
          uv run --project engine --frozen python scripts/smoke_engine.py "$RUNNER_TEMP/squashfs-root"
      - name: Verify staged installers and report SHA-256
        run: uv run --project engine --frozen python scripts/stage_installers.py "$TARGET" --verify
      - name: Upload verified installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: huntwick-${{ matrix.target }}
          path: installers/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
